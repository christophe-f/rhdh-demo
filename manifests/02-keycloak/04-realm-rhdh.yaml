apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: rhdh-realm
  namespace: rhdh-auth
spec:
  keycloakCRName: rhdh-keycloak
  realm:
    id: redhat-developer-hub
    realm: redhat-developer-hub
    displayName: "Red Hat Developer Hub Identity"
    enabled: true
    sslRequired: "external"
    registrationAllowed: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    clients:
      - clientId: rhdh
        name: "Red Hat Developer Hub"
        description: "OIDC Client for RHDH"
        enabled: true
        protocol: "openid-connect"
        publicClient: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: false
        secret: "rhdh-secret-key-12345"
        redirectUris:
          - "https://*"
          - "http://localhost:3000/*"
        webOrigins:
          - "+"
        attributes:
          post.logout.redirect.uris: "+"
    users:
      - username: developer
        enabled: true
        email: developer@example.com
        firstName: Dev
        lastName: User
        emailVerified: true
        credentials:
          - type: password
            value: developer123!
            temporary: false
      - username: platform-admin
        enabled: true
        email: admin@example.com
        firstName: Platform
        lastName: Admin
        emailVerified: true
        credentials:
          - type: password
            value: admin123!
            temporary: false
