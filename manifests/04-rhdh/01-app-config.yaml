apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: rhdh
data:
  app-config-rhdh.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://${RHDH_HOST}

    backend:
      auth:
        externalAccess:
          - type: legacy
            options:
              secret: ${BACKEND_SECRET}
              subject: legacy-default-subject
      baseUrl: https://${RHDH_HOST}
      cors:
        origin: https://${RHDH_HOST}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      csp:
        connect-src: ["'self'", 'http:', 'https:']
      reading:
        allow:
          - host: rhdh-templates.rhdh.svc:8080
          - host: rhdh-templates.rhdh.svc
          - host: '*.apps-crc.testing'
      database:
        client: pg
        connection:
          host: rhdh-postgresql
          port: 5432
          user: ${POSTGRESQL_USER}
          password: ${POSTGRESQL_PASSWORD}
          database: ${POSTGRESQL_DATABASE}
          ssl: false

    auth:
      environment: production
      session:
        secret: ${SESSION_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: https://${KEYCLOAK_HOST}/realms/redhat-developer-hub
            clientId: rhdh
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
                  dangerouslyAllowSignInWithoutUserInCatalog: true
                - resolver: oidcSubClaimMatchingKeycloakUserId

    signInPage: oidc

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - url: https://kubernetes.default.svc
              name: local-openshift
              authProvider: serviceAccount
              serviceAccountToken: ${K8S_SA_TOKEN}
              skipTLSVerify: true

    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: local-gitops
              url: https://${ARGOCD_HOST}
              token: ${ARGOCD_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      locations:
        - type: url
          target: http://rhdh-templates.rhdh.svc:8080/quarkus-service/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: http://rhdh-templates.rhdh.svc:8080/org/users.yaml
          rules:
            - allow: [User, Group]

