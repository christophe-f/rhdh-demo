apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhdh-templates-server
  namespace: rhdh
  labels:
    app: rhdh-templates-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhdh-templates-server
  template:
    metadata:
      labels:
        app: rhdh-templates-server
    spec:
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-122:latest
          command: ["/usr/libexec/s2i/run"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: root
              mountPath: /opt/app-root/src/quarkus-service/template.yaml
              subPath: template.yaml
            - name: skeleton
              mountPath: /opt/app-root/src/quarkus-service/skeleton/catalog-info.yaml
              subPath: catalog-info.yaml
            - name: skeleton
              mountPath: /opt/app-root/src/quarkus-service/skeleton/pom.xml
              subPath: pom.xml
            - name: skeleton
              mountPath: /opt/app-root/src/quarkus-service/skeleton/README.md
              subPath: README.md
            - name: java
              mountPath: /opt/app-root/src/quarkus-service/skeleton/src/main/java/org/acme/GreetingResource.java
              subPath: GreetingResource.java
            - name: java
              mountPath: /opt/app-root/src/quarkus-service/skeleton/src/main/resources/application.properties
              subPath: application.properties
            - name: ci
              mountPath: /opt/app-root/src/quarkus-service/skeleton/tekton/pipeline.yaml
              subPath: pipeline.yaml
            - name: ci
              mountPath: /opt/app-root/src/quarkus-service/skeleton/argocd/application.yaml
              subPath: application.yaml
            - name: org-users
              mountPath: /opt/app-root/src/org/users.yaml
              subPath: users.yaml
      volumes:
        - name: root
          configMap:
            name: template-quarkus-root
        - name: skeleton
          configMap:
            name: template-quarkus-skeleton
        - name: java
          configMap:
            name: template-quarkus-java
        - name: ci
          configMap:
            name: template-quarkus-ci
        - name: org-users
          configMap:
            name: template-org-users
---
apiVersion: v1
kind: Service
metadata:
  name: rhdh-templates
  namespace: rhdh
spec:
  selector:
    app: rhdh-templates-server
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rhdh-templates
  namespace: rhdh
spec:
  to:
    kind: Service
    name: rhdh-templates
  port:
    targetPort: 8080
