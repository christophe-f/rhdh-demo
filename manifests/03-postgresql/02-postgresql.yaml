apiVersion: v1
kind: Secret
metadata:
  name: rhdh-postgresql
  namespace: rhdh
type: Opaque
stringData:
  POSTGRESQL_USER: rhdh
  POSTGRESQL_PASSWORD: rhdhpassword123!
  POSTGRESQL_DATABASE: rhdh
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rhdh-postgresql-pvc
  namespace: rhdh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhdh-postgresql
  namespace: rhdh
  labels:
    app: rhdh-postgresql
    app.kubernetes.io/part-of: rhdh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhdh-postgresql
  template:
    metadata:
      labels:
        app: rhdh-postgresql
        app.kubernetes.io/part-of: rhdh
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: rhdh-postgresql
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rhdh-postgresql
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: rhdh-postgresql
                  key: POSTGRESQL_DATABASE
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rhdh-postgresql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rhdh-postgresql
  namespace: rhdh
  labels:
    app: rhdh-postgresql
    app.kubernetes.io/part-of: rhdh
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app: rhdh-postgresql
